<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA-style cover maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="stage">
    <canvas id="cover" width="1920" height="1080" aria-label="The cover preview"></canvas>
    <p class="hint">Click a panel to select it, drag to pan, scroll to zoom.</p>
  </section>
  <aside class="controls">
    <h1>Vice Cover Studio</h1>
    <p class="lede">Turn a photo and a caption into a GTA-style poster cover. Everything runs offline.</p>

    <section class="group">
      <h2>Layout</h2>
      <div id="layoutRow" class="chips" role="group" aria-label="Layout"></div>
    </section>

    <section class="group">
      <h2>Panels</h2>
      <div id="panelRow" class="thumbs" role="group" aria-label="Panels"></div>
      <div class="row">
        <label class="zoom">Zoom <input id="zoom" type="range" min="1" max="3" step="0.05" value="1"> <span id="zoomVal">100%</span></label>
      </div>
    </section>

    <section class="group">
      <h2>Photos</h2>
      <div id="sampleRow" class="thumbs" role="group" aria-label="Sample photos"></div>
      <div class="row">
        <label class="file">Upload your own <input id="upload" type="file" accept="image/*"></label>
        <button id="fillAll" type="button">Fill all panels</button>
      </div>
    </section>

    <section class="group">
      <h2>Colour grade</h2>
      <div id="gradeRow" class="chips" role="group" aria-label="Colour grade"></div>
    </section>

    <section class="group">
      <h2>Caption</h2>
      <label>Title <input id="caption" type="text" maxlength="40" value="VICE NIGHTS"></label>
      <label>Tagline <input id="tagline" type="text" maxlength="40" value="OCEAN DRIVE • 2026"></label>
      <div id="fontRow" class="chips" role="group" aria-label="Caption font"></div>
      <div id="colorRow" class="swatches" role="group" aria-label="Caption colour"></div>
      <div class="row">
        <label class="slider">Size <input id="capSize" type="range" min="0" max="100" value="50"> <span id="capSizeVal">50%</span></label>
        <label class="slider">Tilt <input id="capTilt" type="range" min="-10" max="10" value="-2"> <span id="capTiltVal">-2°</span></label>
      </div>
      <div class="row">
        <label class="check"><input id="capOutline" type="checkbox" checked> Outline</label>
        <label>Position
          <select id="capPos">
            <option value="bottom" selected>Bottom</option>
            <option value="top">Top</option>
          </select>
        </label>
      </div>
    </section>

    <section class="group export">
      <h2>Export</h2>
      <div class="row">
        <label>Size <select id="size"></select></label>
        <button id="export" type="button">Export PNG</button>
      </div>
      <p id="status" role="status"></p>
    </section>
  </aside>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
